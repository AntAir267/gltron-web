<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GLtron</title>
<style>
  :root { --bg: #000; --fg: #9cf; --track: #123; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; overflow: hidden; }
  /* the game lays itself out for 4:3, so letterbox to that */
  #canvas { position: absolute; inset: 0; margin: auto; display: block; outline: none;
    width: min(100vw, calc(100vh * 4 / 3)); height: min(100vh, calc(100vw * 3 / 4));
    background: #000; touch-action: none; }
  #loading { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(320px, 80vw); text-align: center; pointer-events: none; }
  #track { height: 4px; background: var(--track); margin-top: 8px; }
  #bar { height: 100%; width: 0; background: var(--fg); transition: width .1s; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<div id="loading"><div id="status">Loading GLtron...</div><div id="track"><div id="bar"></div></div></div>
<script src="music/tracks.js"></script>
<script src="shell.js"></script>
</body>
</html>
